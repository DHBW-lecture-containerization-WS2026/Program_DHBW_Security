
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Security Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 760px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 35px;
        }

        .card {
            background: #1e293b;
            padding: 28px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .card p {
            color: #cbd5e1;
        }

        input, button {
            font: inherit;
            border-radius: 8px;
            padding: 13px;
        }

        input {
            width: 100%;
            background: #334155;
            color: white;
            border: 1px solid #64748b;
            margin: 10px 0;
        }

        button {
            width: 100%;
            margin-top: 10px;
            border: none;
            background: #38bdf8;
            color: #082f49;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .result {
            margin-top: 20px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .consent-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 15px;
        font-size: 14px;
        line-height: 1.5;
        color: #cbd5e1;
    }

    .result-box {
        padding: 16px;
        border-radius: 10px;
        border-left: 5px solid;
        white-space: normal;
    }

    .result-box.danger  { background: #450a0a; border-color: #ef4444; }
    .result-box.warning { background: #422006; border-color: #f59e0b; }
    .result-box.ok      { background: #052e16; border-color: #22c55e; }
    .result-box.error   { background: #3f3f46; border-color: #a1a1aa; }

    .result-box strong {
        display: block;
        margin-bottom: 6px;
    }

    .result-box ul {
        margin: 8px 0 0;
        padding-left: 20px;
    }

    .result-box .checked-url {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 10px;
    }

    #email-consent {
        width: auto;
        margin: 3px 0 0;
        accent-color: #38bdf8;
    }
    </style>
</head>

<body>
<main>
    <h1>🛡️ Security Hub</h1>
    <p class="subtitle">Your personal security toolkit</p>

    <!-- URL CHECKER -->
    <section class="card">
        <h2>🔗 URL Security Checker</h2>
        <p>Prüfe eine URL auf bekannte Bedrohungen.</p>

        <form id="url-form">
            <input
                id="url-input"
                type="text"
                inputmode="url"
                autocomplete="off"
                spellcheck="false"
                placeholder="example.com oder https://example.com"
                required
            >

            <button id="url-button" type="submit">
                Analysieren
            </button>
        </form>

        <div id="url-result" class="result" role="status"></div>
    </section>

    <!-- PASSWORD GENERATOR -->
    <section class="card">
        <h2>🔑 Password Generator</h2>
        <p>Erstelle ein sicheres, zufälliges Passwort.</p>

        <form id="password-form">
            <label for="password-length">Passwortlänge</label>

            <input
                id="password-length"
                type="number"
                min="12"
                max="64"
                value="20"
                required
            >

            <button id="password-button" type="submit">
                Passwort generieren
            </button>
        </form>

        <div id="password-result" class="result" role="status"></div>
    </section>

     <section class="card">
        <h2>📧 E-Mail Leak Checker</h2>

        <p>
            Prüfe, ob deine E-Mail-Adresse in
            bekannten Datenlecks vorkommt.
        </p>

        <form id="email-form">

            <label for="email-input">
                E-Mail-Adresse
            </label>

            <input
                id="email-input"
                type="email"
                placeholder="name@example.com"
                required
            >

            <label class="consent-row">
                <input
                    id="email-consent"
                    type="checkbox"
                    required
                >

                <span>
                    Ich stimme zu, dass meine E-Mail-Adresse
                    zur Überprüfung an XposedOrNot
                    übermittelt wird.
                </span>
            </label>

            <button id="email-button" type="submit">
                E-Mail analysieren
            </button>

        </form>

        <div
            id="email-result"
            class="result"
            role="status"
            aria-live="polite"
        ></div>
    </section>
</main>

<script>
    // URL CHECKER
    const urlForm = document.getElementById("url-form");
    const urlResult = document.getElementById("url-result");
    const urlButton = document.getElementById("url-button");

    // Ergebnis sicher (ohne innerHTML) als farbige Box darstellen
    function renderUrlResult(kind, title, text, items, checkedUrl) {
        urlResult.replaceChildren();

        const box = document.createElement("div");
        box.className = "result-box " + kind;

        const heading = document.createElement("strong");
        heading.textContent = title;
        box.appendChild(heading);

        if (text) {
            const paragraph = document.createElement("div");
            paragraph.textContent = text;
            box.appendChild(paragraph);
        }

        if (items && items.length > 0) {
            const list = document.createElement("ul");
            for (const item of items) {
                const li = document.createElement("li");
                li.textContent = item;
                list.appendChild(li);
            }
            box.appendChild(list);
        }

        if (checkedUrl) {
            const urlLine = document.createElement("div");
            urlLine.className = "checked-url";
            urlLine.textContent = "Geprüft: " + checkedUrl;
            box.appendChild(urlLine);
        }

        urlResult.appendChild(box);
    }

    // "example.com" -> "https://example.com"
    function normalizeUrl(value) {
        const trimmed = value.trim();
        if (/^[a-z][a-z0-9+.-]*:\/\//i.test(trimmed)) {
            return trimmed;
        }
        return "https://" + trimmed;
    }

    function errorMessage(data, status) {
        if (status === 422) {
            return "Das ist keine gültige URL (nur http/https).";
        }
        if (data && typeof data.detail === "string") {
            return data.detail;
        }
        return "URL-Prüfung fehlgeschlagen.";
    }

    urlForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        urlButton.disabled = true;
        urlResult.textContent = "🔄 Analysiere URL ...";

        try {
            const url = normalizeUrl(
                document.getElementById("url-input").value
            );

            const response = await fetch("/api/analyze/url", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ url })
            });

            const data = await response.json().catch(() => null);

            if (!response.ok) {
                throw new Error(errorMessage(data, response.status));
            }

            const warnings = data.warnings || [];

            if (data.status === "threat_detected") {
                const labels = (data.threat_types || [])
                    .map((threat) => threat.label);

                renderUrlResult(
                    "danger",
                    "⚠️ Bekannte Bedrohung gefunden!",
                    "Google Safe Browsing stuft diese URL als gefährlich " +
                    "ein. Öffne sie nicht.",
                    labels.concat(warnings),
                    data.url
                );
            } else if (data.status === "no_known_threat") {
                if (warnings.length > 0) {
                    renderUrlResult(
                        "warning",
                        "🟡 Keine bekannte Bedrohung, aber Auffälligkeiten",
                        "Google kennt keine Bedrohung. Folgende Punkte " +
                        "solltest du trotzdem prüfen:",
                        warnings,
                        data.url
                    );
                } else {
                    renderUrlResult(
                        "ok",
                        "✅ Keine bekannte Bedrohung gefunden",
                        "Das ist keine Sicherheitsgarantie. Prüfe " +
                        "trotzdem, ob du der Seite vertraust.",
                        [],
                        data.url
                    );
                }
            } else {
                throw new Error("Unbekanntes Analyseergebnis.");
            }

        } catch (error) {
            renderUrlResult("error", "❌ " + error.message, "", [], "");
        } finally {
            urlButton.disabled = false;
        }
    });


    // PASSWORD GENERATOR
    const passwordForm = document.getElementById("password-form");
    const passwordResult = document.getElementById("password-result");
    const passwordButton = document.getElementById("password-button");

    passwordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        passwordButton.disabled = true;
        passwordResult.textContent = "Generiere Passwort ...";

        try {
            const length = Number(
                document.getElementById("password-length").value
            );

            const response = await fetch("/api/generate/password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ length })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error("Passwortgenerierung fehlgeschlagen.");
            }

            passwordResult.textContent =
                "Generiertes Passwort:\n" + data.password;

        } catch (error) {
            passwordResult.textContent = "❌ " + error.message;
        } finally {
            passwordButton.disabled = false;
        }
    });



    
// ----------------------------------
// EMAIL LEAK CHECKER
// ----------------------------------

    const emailForm = document.getElementById("email-form");
    const emailResult = document.getElementById("email-result");
    const emailButton = document.getElementById("email-button");


    emailForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email-input").value.trim();
        const consent = document.getElementById("email-consent").checked;

        emailButton.disabled = true;
        emailResult.textContent = "🔄 E-Mail wird analysiert ...";

        try {
            const response = await fetch("/api/analyze/email", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    consent: consent
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    typeof data.detail === "string"
                        ? data.detail
                        : "E-Mail-Prüfung fehlgeschlagen."
                );
            }

            if (data.status === "breach_detected") {
                emailResult.textContent =
                    "⚠️ Achtung! " + data.count +
                    " bekannte Datenlecks gefunden.\n\n" +
                    "Betroffene Dienste:\n" +
                    data.breaches.join(", ") +
                    "\n\nEmpfehlung: Ändere betroffene Passwörter " +
                    "und aktiviere Zwei-Faktor-Authentifizierung.";

            } else if (data.status === "no_known_breach") {
                emailResult.textContent =
                    "✅ Keine bekannten Datenlecks gefunden.\n" +
                    "Das bedeutet nicht, dass deine " +
                    "E-Mail-Adresse garantiert sicher ist.";

            } else {
                throw new Error("Unbekanntes Analyseergebnis.");
            }

        } catch (error) {
            emailResult.textContent =
                "❌ " + error.message;

        } finally {
            emailButton.disabled = false;
        }
    });

</script>
</body>
</html>
